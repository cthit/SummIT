{% extends "base.html" %} {% block content %}
<h1>Admin</h1>

<div class="center-content">
  <h2 class="inline-display">Select meeting:</h2>
  <select id="meetingSelect" onchange="loadMeetingRequirements()">
    <option value="">Select a meeting...</option>
    {% for meeting in meetings %}
    <option value="{{ meeting.id }}">
      {{ meeting.date }}
      {% if meeting.study_period.lp != 5 %}Study Period {{ meeting.study_period.lp }}{% else %}Summer{% endif %}
    </option>
    {% endfor %}
  </select>
  <a href="{{ url_for('main.create_meeting_page') }}">Create Meeting</a>
</div>

<div id="requirementsContainer" class="hidden">
  <h2>Document Requirements</h2>
  <div id="requirementsTable"></div>
  <button onclick="editMeeting()">Edit Meeting</button>
  <button onclick="deleteMeeting()">Delete Meeting</button>
</div>

<script>
let currentMeetingId = null;

function loadMeetingRequirements() {
  const select = document.getElementById('meetingSelect');
  const meetingId = select.value;
  const container = document.getElementById('requirementsContainer');
  const tableDiv = document.getElementById('requirementsTable');
  
  if (!meetingId) {
    container.style.display = 'none';
    return;
  }
  
  currentMeetingId = meetingId;
  
  fetch(`/admin/meeting-requirements/${meetingId}`)
    .then(r => r.json())
    .then(data => {
      let html = '<table class="requirements-table"><thead><tr><th>Group</th>';
      
      data.doc_types.forEach(dt => {
        html += `<th>${dt[1]}</th>`;
      });
      html += '</tr></thead><tbody>';
      
      data.groups.forEach(group => {
        html += `<tr><td><strong>${group.name}</strong></td>`;
        data.doc_types.forEach(dt => {
          const checked = data.requires[group.id] && data.requires[group.id].includes(dt[0]) ? '✓' : '';
          html += `<td>${checked}</td>`;
        });
        html += '</tr>';
      });
      
      html += '</tbody></table>';
      tableDiv.innerHTML = html;
      container.style.display = 'block';
    });
}

function editMeeting() {
  if (currentMeetingId) {
    location.href = `/admin/manage-meeting/${currentMeetingId}`;
  }
}

function deleteMeeting() {
  if (currentMeetingId && confirm('Delete this meeting and all associated documents?')) {
    location.href = `/admin/delete-meeting/${currentMeetingId}`;
  }
}
</script>

{% endblock %}
