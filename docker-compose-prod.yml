x-app-environment: &app-environment
  GAMMA_ROOT: "${GAMMA_ROOT:-}"
  GAMMA_CLIENT_ID: "${GAMMA_CLIENT_ID:-}"
  GAMMA_CLIENT_SECRET: "${GAMMA_CLIENT_SECRET:-}"
  GAMMA_CLIENT_API_KEY: "${GAMMA_CLIENT_API_KEY:-}"
  AUTH_HEADER: "${AUTH_HEADER:-}"
  APP_SECRET_KEY: "${APP_SECRET_KEY:-}"
  APP_MAX_CONTENT_LENGTH: "${APP_MAX_CONTENT_LENGTH:-16000000}"
  FLASK_APP: "${FLASK_APP:-project}"
  FLASK_DEBUG: "${FLASK_DEBUG:-0}"
  DEV_ENV: "${DEV_ENV:-0}"
  DB_HOST: "${DB_HOST:-summit_db}"
  DB_PORT: "${DB_PORT:-5432}"
  POSTGRES_DB: "${POSTGRES_DB:-summit_db}"
  POSTGRES_USER: "${POSTGRES_USER:-postgres}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-}"
  GOTIFY_URL: "${GOTIFY_URL:-http://gotify:8080}"
  GOTIFY_PRE_SHARED_KEY: "${GOTIFY_PRE_SHARED_KEY:-}"
  GAMMA_INFO_API_KEY: "${GAMMA_INFO_API_KEY:-}"
  GAMMA_INFO_AUTH_HEADER: "${GAMMA_INFO_AUTH_HEADER:-}"
  MAIL_REMINDER_DAYS_BEFORE: "${MAIL_REMINDER_DAYS_BEFORE:-3}"

services:
  summit_web:
    image: ghcr.io/cthit/summit:dev
    volumes:
      - summit_uploads:/data/uploads
    depends_on:
      summit_db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      <<: *app-environment
      TZ: Europe/Stockholm
      ACTIVE_GROUPS_WHITELIST: b7ab170f-712d-40b0-9ed0-aca9bde07a61,9adae6f5-58cd-4c14-aa6f-caaecfe98402,dea3493e-66e4-44b2-a657-cb57a6840dab, 1b68e8da-2421-4c4c-b6e7-a78c9de440fc, 5ec2fd7e-118f-4753-8419-8b2e00196bfa, 2869d390-4f66-4b32-97fb-aed09c25d6d9, 0e9f791d-8151-4f73-834e-906d36323cfd, 75fe6bc1-3c4a-47a7-90d3-a759b6b54f1e, d5dd9e9e-e6d1-4814-a466-d826645fdbf0, 32da51ec-2854-4bc2-b19a-30dad5dcc501, 3b90c761-2179-4cf4-b5cd-07ae804667cb, 22748cb2-a2fa-46d7-a453-f3d99dd9f10c, 45432d44-0de4-4ed0-88ce-8cdf31b72f73, f80902c5-08ff-4f41-a0ff-14cf43e69852
    labels:
      traefik.enable: "true"
      traefik.http.routers.summit.rule: "Host(`summit.chalmers.it`)"
      traefik.http.services.summit.loadbalancer.server.port: "5000"
      traefik.http.routers.summit.tls.certresolver: "cfResolver"
      traefik.http.routers.summit.tls: "true"
    networks:
      - default
      - gotify
      - traefik

  summit_mailer:
    image: ghcr.io/cthit/summit:dev
    command: sh -c 'while true; do uv run flask send-due-mails || echo "send-due-mails failed"; sleep 900; done'
    depends_on:
      summit_db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      <<: *app-environment
      TZ: Europe/Stockholm
    networks:
      - default
      - gotify

  summit_db:
    image: ghcr.io/cthit/summit-db:dev
    ports:
      - "5432:5432"
    volumes:
      - summit_database_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-summit_db}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-}"
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  summit_database_data:
  summit_uploads:

networks:
  default:
  gotify:
    external: true
  traefik:
    external: true
