x-app-environment: &app-environment
  GAMMA_ROOT: "${GAMMA_ROOT:-}"
  GAMMA_CLIENT_ID: "${GAMMA_CLIENT_ID:-}"
  GAMMA_CLIENT_SECRET: "${GAMMA_CLIENT_SECRET:-}"
  GAMMA_CLIENT_API_KEY: "${GAMMA_CLIENT_API_KEY:-}"
  AUTH_HEADER: "${AUTH_HEADER:-}"
  APP_SECRET_KEY: "${APP_SECRET_KEY:-}"
  APP_MAX_CONTENT_LENGTH: "${APP_MAX_CONTENT_LENGTH:-16000000}"
  FLASK_APP: "${FLASK_APP:-project}"
  FLASK_DEBUG: "${FLASK_DEBUG:-0}"
  DEV_ENV: "${DEV_ENV:-0}"
  DB_HOST: "${DB_HOST:-summit_db}"
  DB_PORT: "${DB_PORT:-5432}"
  POSTGRES_DB: "${POSTGRES_DB:-summit_db}"
  POSTGRES_USER: "${POSTGRES_USER:-postgres}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-}"
  GOTIFY_URL: "${GOTIFY_URL:-http://gotify:8080}"
  GOTIFY_PRE_SHARED_KEY: "${GOTIFY_PRE_SHARED_KEY:-}"
  GAMMA_INFO_API_KEY: "${GAMMA_INFO_API_KEY:-}"
  GAMMA_INFO_AUTH_HEADER: "${GAMMA_INFO_AUTH_HEADER:-}"
  MAIL_REMINDER_DAYS_BEFORE: "${MAIL_REMINDER_DAYS_BEFORE:-3}"

services:
  summit_web:
    image: ghcr.io/cthit/summit:dev
    ports:
      - "5000:5000"
    volumes:
      - summit_uploads:/data/uploads
    depends_on:
      summit_db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      <<: *app-environment
      TZ: Europe/Stockholm
      ACTIVE_GROUPS_WHITELIST: "${ACTIVE_GROUPS_WHITELIST:-}"
    networks:
      - default
      - gotify

  summit_mailer:
    image: ghcr.io/cthit/summit:dev
    command: sh -c 'while true; do uv run flask send-due-mails || echo "send-due-mails failed"; sleep 900; done'
    depends_on:
      summit_db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      <<: *app-environment
      TZ: Europe/Stockholm
    networks:
      - default
      - gotify

  summit_db:
    image: ghcr.io/cthit/summit-db:dev
    ports:
      - "5432:5432"
    volumes:
      - summit_database_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-summit_db}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-}"
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  summit_database_data:
  summit_uploads:

networks:
  default:
  gotify:
    external: true
